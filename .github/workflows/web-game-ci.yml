name: web-game-ci

on:
  push:
    paths: ["web_app/game/**", ".github/workflows/web-game-ci.yml"]
  pull_request:
    paths: ["web_app/game/**", ".github/workflows/web-game-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app/game
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web_app/game/package.json # packageManager pin lives in the nested workspace root, NOT the repo root (A1 Step 2)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web_app/game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm build:atlas # plan T24 order: atlas first, license gate second
      - name: Asset license check
        run: node scripts/check-assets.mjs
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app/game
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web_app/game/package.json # nested workspace root, not repo root (same as check job)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web_app/game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # W3 T15 (A5): the timing/decode/clock-invariant evidence specs run on all three engines
      # (playwright.config.ts projects; firefox+webkit grep-scoped so the rest stays chromium-only).
      - run: pnpm --filter @airhythm/web exec playwright install --with-deps chromium firefox webkit
      # EXPECTED-RED (operator ruling 2026-10-21, PLAN.md carry-over C1): the D21 mapping-error row
      # asserts a frozen 5 ms budget against hardware-dependent timing. It measures 11.58 ms on this
      # runner and 12.85 ms on the operator machine, so it is red on any host above 5 ms — a
      # documented state, not a regression. It is NOT relaxed (D21 forbids widening the budget) and
      # NOT skipped silently: the row still runs and still records its evidence.
      - run: pnpm --filter @airhythm/web e2e
        continue-on-error: true
      # The gate that must actually pass: the same suite WITHOUT the D21 mapping-error row. A
      # genuine regression anywhere else still turns this job red, so the expected-red step above
      # cannot mask one.
      - run: pnpm --filter @airhythm/web exec playwright test --project=chromium --grep-invert "mapping error on REAL inputs"
      # W3 A5 (2026-10-17): the timing evidence specs are wall-clock sensitive — at workers:2 the
      # scripted claim-2 loop loses the CPU and lands only ~27/160 presses in-window (vs 136/160
      # serially). Run them in their own single-worker invocation.
      - run: pnpm --filter @airhythm/web e2e:timing
      # W3 T14 (spec §8 default 1): the §7 fixture-decode gate needs decodeAudioData proven on
      # chromium + firefox + WEBKIT. WebKit's Web Audio availability differs by port — Playwright's
      # Windows build compiles it out (microsoft/playwright#14105), so this Linux runner is the only
      # place the third engine can be exercised. Uses the committed 3-engine config.
      - run: pnpm --filter @airhythm/web e2e:fixture-decode
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: w1-highway-screenshot
          path: web_app/game/e2e/screenshots/w1-highway.png
