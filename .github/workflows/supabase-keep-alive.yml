name: Supabase keep-alive
on:
  schedule:
    - cron: "17 4 * * *"   # DAILY (spec §3 A14: GitHub cron can be delayed/skipped under load;
                           # every-N-days cadences lose their margin; off the :00 mark)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query keepalive table (named-table PostgREST read = real DB activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Named-table query required: GET /rest/v1/ is OpenAPI introspection and does
          # NOT reset the pause timer (spec §3 A14). The key value is never echoed
          # (Supabase no-logging warning) — only the HTTP status is printed.
          code=$(curl -sS -o /tmp/keepalive-body -w "%{http_code}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/keepalive?select=*&limit=1")
          echo "keepalive status=${code}"
          case "${code}" in
            2??) echo "OK";;
            *)   echo "keepalive FAILED with status ${code}"; exit 1;;
          esac
